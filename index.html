<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dependency Hell</title>
  <link rel="stylesheet" href="css/game.css">
</head>
<body>
  <div id="stage">
    <div id="topbar">
      <div id="tb-room"><b id="room-name">app</b><span id="room-sub"></span></div>
      <div class="meter" id="m-stb"><label>STABILITY</label><div class="bar"><i id="stb-fill"></i></div><b id="stb-val">100</b></div>
      <div class="stat"><label>COMMITS</label><b id="commits">0</b></div>
      <div class="stat" id="debt-box"><label>TECH DEBT</label><b id="debt">0</b><em id="debt-label"></em></div>
      <div class="stat"><label>OBSERVABILITY</label><b id="obs"></b></div>
    </div>
    <canvas id="arena" width="320" height="192"></canvas>
    <div id="hint"></div>
    <div id="banner"><b></b><span></span></div>
    <aside id="side">
      <h1>DEPENDENCY HELL</h1>
      <section id="train"></section>
      <section id="pager"></section>
      <section id="pkgs"></section>
      <section id="mini"><canvas id="minimap" width="592" height="340"></canvas></section>
      <section id="log"></section>
      <footer id="keys">TAB map · H help · N sound</footer>
    </aside>
    <div id="overlay" class="hidden"></div>
    <div id="full" class="hidden"></div>
    <div id="crt"></div>
  </div>
  <script src="js/rng.js"></script>
  <script src="js/content.js"></script>
  <script src="js/graph.js"></script>
  <script src="js/sim.js"></script>
  <script src="js/reports.js"></script>
  <script src="js/bot.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/render.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
